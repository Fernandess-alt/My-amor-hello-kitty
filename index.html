<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hello Kitty 💗</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #160914;
            font-family: Arial, sans-serif;
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            display: block;
        }

        .mensagem {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            color: white;
            text-align: center;

            pointer-events: none;

            text-shadow:
                0 0 10px #ff69b4,
                0 0 25px #ff1493;
        }

        .mensagem h1 {
            font-size: clamp(40px, 9vw, 80px);
            margin-bottom: 10px;
        }

        .mensagem p {
            font-size: clamp(14px, 3vw, 22px);
        }

    </style>

</head>

<body>

<canvas id="canvas"></canvas>

<div class="mensagem">

    <h1>💗</h1>

    <p>Clique na tela 🎀</p>

</div>


<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let width;
let height;
let dpr;


/* =========================================================
   QUANTIDADES
========================================================= */

const FLOAT_COUNT = 35;
const HEART_COUNT = 50;


/* =========================================================
   CORES
========================================================= */

const PINK_SHADES = [
    "#ff1493",
    "#ff69b4",
    "#ff85c1",
    "#ffb6d9",
    "#ffc0cb"
];


/* =========================================================
   CANVAS
========================================================= */

function resizeCanvas() {

    dpr = Math.min(
        window.devicePixelRatio || 1,
        2
    );

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


/* =========================================================
   PARTÍCULAS HELLO KITTY
========================================================= */

const floatParticles = [];


/* =========================================================
   CORAÇÕES
========================================================= */

const hearts = [];


/* =========================================================
   PARTÍCULA HELLO KITTY
========================================================= */

class KittyParticle {

    constructor() {

        this.x =
            Math.random() * width;

        this.y =
            Math.random() * height;

        this.size =
            Math.random() * 6 + 9;

        this.speed =
            Math.random() * 0.4 + 0.15;

        this.drift =
            (Math.random() - 0.5) * 0.4;

        this.angle =
            Math.random() * Math.PI * 2;

        this.rotation =
            (Math.random() - 0.5) * 0.01;

    }


    update() {

        this.y -= this.speed;

        this.x += this.drift;

        this.angle += this.rotation;


        if (this.y < -30) {

            this.y =
                height + 30;

            this.x =
                Math.random() * width;

        }


        if (this.x < -30) {

            this.x =
                width + 30;

        }


        if (this.x > width + 30) {

            this.x = -30;

        }

    }


    draw() {

        const s = this.size;

        ctx.save();

        ctx.translate(
            this.x,
            this.y
        );

        ctx.rotate(
            Math.sin(this.angle) * 0.08
        );


        /* brilho */

        ctx.shadowBlur = 12;

        ctx.shadowColor =
            "#ff69b4";


        /* =========================
           ORELHA ESQUERDA
        ========================= */

        ctx.beginPath();

        ctx.moveTo(
            -s * 0.8,
            -s * 0.35
        );

        ctx.lineTo(
            -s * 0.95,
            -s * 1.15
        );

        ctx.lineTo(
            -s * 0.2,
            -s * 0.75
        );

        ctx.closePath();

        ctx.fillStyle =
            "#ffffff";

        ctx.fill();


        /* =========================
           ORELHA DIREITA
        ========================= */

        ctx.beginPath();

        ctx.moveTo(
            s * 0.8,
            -s * 0.35
        );

        ctx.lineTo(
            s * 0.95,
            -s * 1.15
        );

        ctx.lineTo(
            s * 0.2,
            -s * 0.75
        );

        ctx.closePath();

        ctx.fill();


        /* =========================
           CABEÇA
        ========================= */

        ctx.beginPath();

        ctx.ellipse(
            0,
            0,
            s,
            s * 0.82,
            0,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#fffafa";

        ctx.fill();


        ctx.shadowBlur = 0;


        /* =========================
           OLHO ESQUERDO
        ========================= */

        ctx.beginPath();

        ctx.ellipse(
            -s * 0.35,
            0,
            s * 0.10,
            s * 0.18,
            0,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#111111";

        ctx.fill();


        /* =========================
           OLHO DIREITO
        ========================= */

        ctx.beginPath();

        ctx.ellipse(
            s * 0.35,
            0,
            s * 0.10,
            s * 0.18,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /* =========================
           NARIZ
        ========================= */

        ctx.beginPath();

        ctx.arc(
            0,
            s * 0.2,
            s * 0.13,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#ffd21f";

        ctx.fill();


        /* =========================
           LACINHO
        ========================= */

        ctx.fillStyle =
            "#ff1493";


        ctx.beginPath();

        ctx.ellipse(
            s * 0.68,
            -s * 0.68,
            s * 0.35,
            s * 0.27,
            -0.5,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.beginPath();

        ctx.ellipse(
            s * 1.05,
            -s * 0.68,
            s * 0.35,
            s * 0.27,
            0.5,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.beginPath();

        ctx.arc(
            s * 0.86,
            -s * 0.68,
            s * 0.16,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#ff69b4";

        ctx.fill();


        ctx.restore();

    }

}


/* =========================================================
   CRIAR HELLO KITTYS
========================================================= */

for (
    let i = 0;
    i < FLOAT_COUNT;
    i++
) {

    floatParticles.push(
        new KittyParticle()
    );

}


/* =========================================================
   CORAÇÃO
========================================================= */

class Heart {

    constructor(x, y) {

        this.x = x;
        this.y = y;

        const angle =
            Math.random() *
            Math.PI * 2;

        const speed =
            Math.random() * 3.5 + 1.5;

        this.vx =
            Math.cos(angle) * speed;

        this.vy =
            Math.sin(angle) * speed;

        this.size =
            Math.random() * 5 + 5;

        this.life = 80;

        this.maxLife = 80;

        this.color =
            PINK_SHADES[
                Math.floor(
                    Math.random() *
                    PINK_SHADES.length
                )
            ];

    }


    update() {

        this.x += this.vx;

        this.y += this.vy;

        this.vx *= 0.97;

        this.vy *= 0.97;

        this.vy += 0.025;

        this.life--;

    }


    draw() {

        const alpha =
            this.life /
            this.maxLife;

        const s =
            this.size;


        ctx.save();

        ctx.translate(
            this.x,
            this.y
        );

        ctx.globalAlpha =
            alpha;

        ctx.shadowBlur = 10;

        ctx.shadowColor =
            this.color;


        /* =========================
           CORAÇÃO
        ========================= */

        ctx.beginPath();

        ctx.moveTo(
            0,
            s * 0.9
        );

        ctx.bezierCurveTo(
            -s * 1.5,
            s * 0.05,
            -s * 0.9,
            -s,
            0,
            -s * 0.35
        );

        ctx.bezierCurveTo(
            s * 0.9,
            -s,
            s * 1.5,
            s * 0.05,
            0,
            s * 0.9
        );

        ctx.closePath();

        ctx.fillStyle =
            this.color;

        ctx.fill();


        ctx.restore();

    }

}


/* =========================================================
   EXPLOSÃO DE CORAÇÕES
========================================================= */

function spawnHeartBurst(
    x,
    y
) {

    for (
        let i = 0;
        i < HEART_COUNT;
        i++
    ) {

        hearts.push(
            new Heart(x, y)
        );

    }

}


/* =========================================================
   CLIQUE
========================================================= */

canvas.addEventListener(
    "click",
    function(event) {

        spawnHeartBurst(
            event.clientX,
            event.clientY
        );

    }
);


/* =========================================================
   CELULAR
========================================================= */

canvas.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();

        const touch =
            event.touches[0];

        spawnHeartBurst(
            touch.clientX,
            touch.clientY
        );

    },
    {
        passive: false
    }
);


/* =========================================================
   FUNDO ROSA
========================================================= */

function drawBackground() {

    const gradient =
        ctx.createRadialGradient(
            width / 2,
            height / 2,
            0,
            width / 2,
            height / 2,
            Math.max(
                width,
                height
            )
        );


    gradient.addColorStop(
        0,
        "#5c1642"
    );

    gradient.addColorStop(
        0.5,
        "#2d0b20"
    );

    gradient.addColorStop(
        1,
        "#10050c"
    );


    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

}


/* =========================================================
   ANIMAÇÃO
========================================================= */

function animate() {

    drawBackground();


    /* HELLO KITTYS */

    for (
        const particle
        of floatParticles
    ) {

        particle.update();

        particle.draw();

    }


    /* CORAÇÕES */

    for (
        let i =
            hearts.length - 1;
        i >= 0;
        i--
    ) {

        const heart =
            hearts[i];

        heart.update();

        heart.draw();


        if (
            heart.life <= 0
        ) {

            hearts.splice(
                i,
                1
            );

        }

    }


    requestAnimationFrame(
        animate
    );

}


animate();

</script>

</body>

</html>
